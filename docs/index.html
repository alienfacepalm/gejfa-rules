<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skyline Spartans — GEJFA Rules 2025</title>
  <meta name="description" content="Skyline Spartans sideline lookup for the 2025 GEJFA rulebook. Type a situation, get the rule.">
  <meta name="theme-color" content="#16281c">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iOS "Add to Home Screen" support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spartans Rules">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Skyline Spartans — GEJFA Rules 2025</h1>
    <a class="pdf-link" href="2025-gejfa-rules.pdf" target="_blank" rel="noopener"
       aria-label="Open the official 2025 GEJFA rulebook PDF in a new tab">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5z"/></svg>
      PDF
    </a>
    <img class="logo" src="icons/logo.png" alt="" width="53" height="64">
    <svg class="arc" viewBox="0 0 320 92" aria-hidden="true">
      <path id="arcPath" d="M 22 86 A 235 235 0 0 1 298 86" fill="none"/>
      <text><textPath href="#arcPath" startOffset="50%" text-anchor="middle">SKYLINE</textPath></text>
    </svg>
    <div class="banner" aria-hidden="true">
      <span>Sammamish</span><span class="year">2025</span><span>Washington</span>
    </div>
    <hr class="stripe">
    <p class="sub">Spartans</p>
    <p class="tagline">GEJFA sideline rules — find it fast</p>
  </header>

  <div class="searchwrap">
    <input id="q" class="search" type="search" inputmode="search" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="Type a situation… (e.g. late weigh in, up 30, ejected)"
           aria-label="Search the rules">
    <button id="clearBtn" class="clear-btn" type="button" aria-label="Clear search" hidden>&times;</button>
    <button id="micBtn" class="mic-btn" type="button" aria-label="Search by voice" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button id="levelBtn" class="level-btn" type="button" aria-label="Filter by level">All</button>
    <button id="browseBtn" class="browse-btn" type="button" aria-label="Browse categories"
            aria-expanded="false" aria-controls="catSheet">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2.4H3zm0 4.8h18v2.4H3zm0 4.8h18V18H3z"/></svg>
    </button>
  </div>

  <div id="catPillRow" class="cat-pill-row" hidden>
    <button id="catPill" class="cat-pill" type="button"></button>
  </div>

  <div id="catSheet" class="level-sheet cat-sheet" hidden>
    <div class="level-sheet-inner" role="dialog" aria-modal="true" aria-labelledby="catSheetTitle">
      <h2 id="catSheetTitle">Browse categories</h2>
      <div id="catOptions" class="cat-options"></div>
    </div>
  </div>

  <div id="levelSheet" class="level-sheet" hidden>
    <div class="level-sheet-inner">
      <h2>Playing level</h2>
      <div id="levelOptions" class="level-options"></div>
    </div>
  </div>

  <main id="results" class="results" aria-live="polite"></main>

  <footer class="foot">
    <p>Source: <em>2025 GEJFA Rules Final</em> (adopted Aug 1, 2025). Quick-reference only — the official rulebook and NFHS rules govern.</p>
  </footer>

  <script src="vendor/minisearch.min.js"></script>
  <script src="data/rules.js"></script>
  <script src="data/situations.js"></script>
  <script src="data/synonyms.js"></script>
  <script src="data/diagrams.js"></script>
  <script src="search.js"></script>
  <script src="app.js"></script>
</body>
</html>
